services:
  - type: web
    name: fake-news-detection-api
    runtime: python
    rootDir: API
    buildCommand: pip install -r ../requirements.txt
    startCommand: python -m uvicorn MAIN:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
